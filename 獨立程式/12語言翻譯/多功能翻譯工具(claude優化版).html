<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: data:; connect-src https://translate.googleapis.com https://api.mymemory.translated.net wss://generativelanguage.googleapis.com; base-uri 'none'; form-action 'none'">
<title>多功能翻譯工具</title>
<style>
/* ===== 多功能翻譯工具 v4.0 樣式 =====
   一套視覺系統：顏色全部是變數（淺色／深色各一組），圓角、陰影、間距集中在最上面。
   手機（≤760px）：底部分頁列（含安全區）、一欄排版。觸控目標一律 ≥44px。 */
:root{
  --bg:#f4f5fa; --card:#ffffff; --card2:#f6f7fc; --ink:#181d2c; --soft:#434c62; --faint:#566077;
  --line:#e1e4ee; --line2:#c9cfe0; --brand:#3550d8; --brand-ink:#2b43b8; --brand-soft:#e8ecff; --on-brand:#ffffff;
  --ok:#136f37; --warn:#8f5200; --err:#bd2238; --err-soft:#fdeaee; --warn-soft:#fff3dc; --ok-soft:#e3f5ea;
  --radius:18px; --radius-sm:12px; --shadow:0 1px 2px rgba(24,29,44,.05),0 8px 24px rgba(24,29,44,.06);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','PingFang TC',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace; --tabbar:0px; --recbar-h:0px;
}
:root[data-theme="dark"]{
  --bg:#0e1117; --card:#161a23; --card2:#1b202b; --ink:#eceff7; --soft:#bac1d2; --faint:#a1aabe;
  --line:#272d3b; --line2:#39415a; --brand:#8fa4ff; --brand-ink:#b0bfff; --brand-soft:#212a4d; --on-brand:#0e1117;
  --ok:#4ade80; --warn:#fbbf24; --err:#ff8294; --err-soft:#3b1b24; --warn-soft:#3a2e12; --ok-soft:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --card:#161a23; --card2:#1b202b; --ink:#eceff7; --soft:#bac1d2; --faint:#a1aabe;
    --line:#272d3b; --line2:#39415a; --brand:#8fa4ff; --brand-ink:#b0bfff; --brand-soft:#212a4d; --on-brand:#0e1117;
    --ok:#4ade80; --warn:#fbbf24; --err:#ff8294; --err-soft:#3b1b24; --warn-soft:#3a2e12; --ok-soft:#12301f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:var(--tabbar);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
::placeholder{color:var(--faint);opacity:1}
.wrap{max-width:1080px;margin:0 auto;padding:8px 16px 40px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* 標頭：一列 */
.top{display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{font-size:1.05rem;font-weight:750;display:flex;align-items:center;gap:9px;flex:none;letter-spacing:.01em}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#8a6bff);display:grid;place-items:center;color:#fff;font-size:1.05rem;flex:none}
.pill{margin-left:auto;display:inline-flex;align-items:center;min-height:44px;min-width:0;max-width:100%;padding:2px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--soft);font-size:.8rem;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pill.err{background:var(--err-soft);color:var(--err);border-color:var(--err)}
.pill.priv{background:var(--ink);color:var(--card);border-color:var(--ink)}
.iconbtn{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:13px;background:var(--card);cursor:pointer;font-size:1.05rem;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{border-color:var(--line2);background:var(--card2)}
.iconbtn.aa{font-weight:700;font-size:.95rem}

/* 分頁 */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;margin:4px 0 14px;box-shadow:var(--shadow)}
.tab{flex:1;min-height:44px;border:0;background:transparent;border-radius:12px;font-weight:650;color:var(--soft);cursor:pointer;padding:0 10px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px}
.tab .ti{font-size:1.05rem}
.tab:hover{background:var(--card2)}
.tab[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}

/* 元件 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h2{font-size:1rem;margin-bottom:10px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.grow>*{flex:1 1 180px;min-width:0}
.hint{color:var(--faint);font-size:.85rem}
.btn{min-height:44px;min-width:44px;padding:0 16px;border:1px solid var(--line2);border-radius:13px;background:var(--card);cursor:pointer;font-weight:650;display:inline-flex;align-items:center;gap:7px;justify-content:center;color:var(--ink);max-width:100%}
.btn:hover{border-color:var(--brand)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.tonal{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-soft)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.rec{background:var(--err);color:#fff;border-color:var(--err)}
.btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{font-size:.9rem;padding:0 13px}
.a-inacts .btn,.a-outacts .btn{padding:0 12px}
.a-inacts,.a-outacts{gap:6px}
select,input[type=text],input[type=password],input[type=search],textarea{font-size:16px;min-height:44px;padding:9px 13px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--card2);width:100%}
textarea{resize:vertical;line-height:1.6}
input[type=range]{min-height:44px;padding:0;width:100%;accent-color:var(--brand)}
a.lnk{display:inline-flex;align-items:center;min-height:44px;color:var(--brand-ink);font-weight:650}
label.lbl{display:block;font-size:.85rem;font-weight:700;color:var(--soft);margin-bottom:4px}
.chk{display:inline-flex;align-items:center;gap:9px;min-height:44px;cursor:pointer;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line2);border-radius:13px;padding:3px}
.seg button{min-height:44px;min-width:44px;padding:0 14px;border:0;background:transparent;border-radius:10px;font-weight:650;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
details>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:650;color:var(--soft)}

/* 語言選擇器（包著真正的 <select>） */
.lp{position:relative;display:block;min-width:0}
.lp-native{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;min-height:0;padding:0;border:0}
.lp-btn{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 13px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--card2);cursor:pointer;font-weight:650;color:var(--ink);text-align:left}
.lp-btn:hover{border-color:var(--brand)}
.lp-cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lp-caret{color:var(--faint);flex:none}
.lp-panel{position:fixed;z-index:180;background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:0 18px 50px rgba(10,14,28,.28);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.lp-panel.sheet{left:0;right:0;bottom:0;top:auto;width:auto;max-height:82vh;border-radius:20px 20px 0 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.lp-back{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:170}
.lp-list{overflow:auto;flex:1;min-height:120px;display:flex;flex-direction:column;gap:2px}
.lp-row{display:flex;align-items:stretch;gap:2px}
.lp-opt{flex:1;min-width:0;min-height:48px;padding:6px 12px;border-radius:11px;cursor:pointer;display:grid;grid-template-columns:1fr auto;grid-template-areas:"n s" "v v";column-gap:10px;align-items:center}
.lp-opt:hover,.lp-opt.act{background:var(--brand-soft)}
.lp-opt.cur .lp-name{color:var(--brand-ink)}
.lp-opt.cur .lp-name::after{content:' ✓'}
.lp-name{grid-area:n;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-sub{grid-area:s;color:var(--faint);font-size:.8rem;white-space:nowrap}
.lp-voice{grid-area:v;color:var(--faint);font-size:.78rem}
.lp-pin{width:44px;min-height:44px;border:0;background:transparent;border-radius:11px;cursor:pointer;font-size:1.1rem;color:var(--soft);align-self:center}
.lp-pin:hover{background:var(--card2)}
.lp-pin[aria-pressed="true"]{color:var(--brand-ink)}
.lp-sec{font-size:.75rem;font-weight:800;letter-spacing:.06em;color:var(--faint);padding:8px 12px 2px}
.lp-hint,.lp-empty{padding:2px 6px}

/* 「⋯」選單 */
.menuwrap{position:relative;display:inline-flex}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:90;min-width:230px;max-width:min(92vw,320px);background:var(--card);border:1px solid var(--line2);border-radius:14px;box-shadow:0 14px 40px rgba(10,14,28,.25);padding:6px}
.menu.up{top:auto;bottom:calc(100% + 6px)}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;background:transparent;border-radius:10px;cursor:pointer;text-align:left;font-weight:600;color:var(--ink)}
.mi:hover,.mi:focus-visible{background:var(--brand-soft)}
.mi.danger{color:var(--err)}
.mi-ic{width:1.4em;text-align:center;flex:none}

/* 翻譯 */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);grid-template-areas:"from swap to" "in . out" "inacts . outacts" ". . outinfo";gap:8px 10px}
.tcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.a-from{grid-area:from}.a-swap{grid-area:swap}.a-to{grid-area:to}.a-in{grid-area:in}.a-inacts{grid-area:inacts}.a-out{grid-area:out}.a-outinfo{grid-area:outinfo}.a-outacts{grid-area:outacts}
.a-from,.a-to,.a-in,.a-out{min-width:0}
.swapcol{display:flex;align-items:flex-start;justify-content:center}
.out{min-height:200px;padding:13px 15px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--card2);white-space:pre-wrap;word-break:break-word;font-size:1.12rem;line-height:1.65}
.out.empty{color:var(--faint)}
.out mark.fail{background:var(--err-soft);color:var(--err);border-radius:4px;padding:0 3px}
.out button.retry{margin-left:6px;min-height:44px;padding:0 12px;border:1px solid var(--err);border-radius:9px;background:var(--card);color:var(--err);cursor:pointer;font-weight:700}
.prov{font-size:.8rem;color:var(--faint);min-height:1.3em}
.statusline{font-size:.85rem;color:var(--soft);min-height:1.3em}
.statusline.err{color:var(--err);font-weight:650}
textarea.in{min-height:170px;font-size:1.1rem}
.toprow{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.optrow{display:contents}
#recent{flex:1 1 0;min-width:0}
#recent:empty{display:none}
@media (max-width:1000px){.a-outacts .lbl-ph,.a-inacts .lbl-ph{display:none}}
.optrow-toggle{display:none}
.ph-only{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:99px;background:var(--card);cursor:pointer;font-size:.85rem;font-weight:600;color:var(--ink);white-space:nowrap}
.chip:hover{border-color:var(--brand)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--card2)}
.mcard.src{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.mcard .lp{flex:1}

/* 面對面 */
.face{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.facehalf{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--card2);display:flex;flex-direction:column;gap:10px;min-height:220px}
.facehalf .fh-head{display:flex;gap:8px;align-items:flex-end}
.facehalf .fh-head>div{flex:1;min-width:0}
.bigbtn{min-height:84px;font-size:1.15rem;border-radius:20px;white-space:normal;text-align:center}
.facehalf .statusline{min-height:2.6em;font-size:.95rem}
.facehalf.flipped{transform:rotate(180deg)}
.facebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.bubble{padding:10px 13px;border-radius:15px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.bubble.me{background:var(--brand-soft);border-color:transparent}
.bubble .src{font-size:.9rem;color:var(--soft)}
.bubble .dst{font-size:1.15rem;font-weight:600}

/* 聽講 */
.subs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subbox{min-height:200px;max-height:46vh;overflow:auto;padding:13px 15px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--card2);white-space:pre-wrap;word-break:break-word;font-size:1.1rem}
.subbox .interim{color:var(--faint)}
.gemlog{font-family:var(--mono);font-size:.78rem;white-space:pre-wrap;max-height:160px;overflow:auto;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.modes .chk{border:1px solid var(--line2);border-radius:13px;padding:0 14px;background:var(--card)}
.modes .chk:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.bigstart{min-height:56px;font-size:1.1rem;padding:0 28px}

/* 紀錄 */
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:6px 6px 6px 12px}
.ritem .main{flex:1;min-width:0;cursor:pointer;background:none;border:0;text-align:left;min-height:44px}
.ritem .main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .main .hint{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-edit{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--card2)}
.seg-edit .meta{font-size:.78rem;color:var(--faint);margin-bottom:4px}
.empty-state{text-align:center;padding:26px 8px}
.empty-state p{margin-bottom:12px}

/* 錄音列、橫幅、對話框、通知 */
.recbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--err);color:#fff;padding:8px 14px;font-weight:650}
.recbar .dotr{width:12px;height:12px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
.recbar .btn{background:#fff;color:#a01d30;border-color:#fff;margin-left:auto}
@keyframes blink{50%{opacity:.3}}
.banners{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-size:.92rem}
.banner span{flex:1 1 200px;min-width:0}
.banner.warn{background:var(--warn-soft);border-color:var(--warn)}
.banner.err{background:var(--err-soft);border-color:var(--err)}
.banner.priv{background:var(--ink);color:var(--card)}
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.55);z-index:200;display:grid;place-items:center;padding:16px}
.dialog{background:var(--card);border-radius:var(--radius);max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}
.dialog h2{font-size:1.1rem;margin-bottom:10px}
.dialog p{margin-bottom:8px}
.dialog .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.onb-dots{display:flex;gap:6px;margin-bottom:12px}
.onb-dots i{width:26px;height:5px;border-radius:9px;background:var(--line2)}
.onb-dots i.on{background:var(--brand)}
.onb-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin:6px 0}
.onb-list li{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
#toasts{position:fixed;top:calc(var(--recbar-h) + 8px);left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,460px);pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:14px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:100%}
.toast span{min-width:0}
.toast.err{background:var(--err);color:#fff}.toast.warn{background:var(--warn);color:#fff}
.toast button{min-height:44px;padding:0 14px;border-radius:9px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;font-weight:700;flex:none}
.zoom{position:fixed;inset:0;z-index:250;background:var(--card);display:flex;flex-direction:column}
.zoom .bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.zoom .body{flex:1;overflow:auto;padding:5vh 7vw;line-height:1.5;font-weight:600;white-space:pre-wrap;word-break:break-word}
.present{position:fixed;inset:0;z-index:260;background:#0b0e16;color:#f4f6fc;display:flex;flex-direction:column}
.present .bar{display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid #2a3042}
.present .bar .btn{background:#1b2130;color:#f4f6fc;border-color:#3a4260}
.present .pbody{flex:1;overflow:auto;padding:4vh 6vw;display:flex;flex-direction:column;gap:2.2vh;justify-content:flex-end}
.present .ps{display:flex;flex-direction:column;gap:.3em}
.present .ps .a{color:#b3bad0;font-size:.62em;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.present .ps .b{font-weight:700;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.present .ps.old{opacity:.55}
.present .ps .b.pending{color:#b3bad0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--faint);font-weight:600}
.kv dd{min-width:0;overflow-wrap:anywhere}
table.snap{width:100%;border-collapse:collapse;font-size:.88rem}
table.snap td,table.snap th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.foot{text-align:center;color:var(--faint);font-size:.82rem;margin-top:18px;line-height:1.8}
.foot a{color:var(--brand-ink);font-weight:650;display:inline-flex;align-items:center;min-height:44px}
.ext{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ext a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:13px;color:var(--soft);text-decoration:none;font-weight:650;background:var(--card)}
.ext a:hover{border-color:var(--brand)}

/* 手機：底部分頁列、一欄排版、翻譯結果在第一屏 */
@media (max-width:760px){
  :root{--tabbar:calc(64px + env(safe-area-inset-bottom,0px))}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;border-width:1px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:50;box-shadow:0 -6px 20px rgba(10,14,28,.07)}
  .tab{flex-direction:column;gap:0;padding:0 2px;font-size:.78rem;border-radius:11px;min-height:48px}
  .tab .ti{font-size:1.15rem;line-height:1.2}
  .wrap{padding:6px 12px 24px}

/* =====================================================================
   10 資料模型與驗證
   所有從磁碟、資料夾、匯入檔讀進來的資料，都必須先通過這裡的整理，
   不合格的欄位被丟棄、字串被截短，絕不直接信任。
   ===================================================================== */
const KINDS = ['single', 'conversation', 'listen', 'transcript', 'live'];
const MAX_TEXT = 200000, MAX_SEGS = 20000, MAX_TITLE = 200;
const SINGLE_LIMIT = 200;
const str = (v, n = MAX_TEXT) => (typeof v === 'string' ? v.slice(0, n) : '');
const num = (v, d = 0) => (Number.isFinite(+v) ? +v : d);
const codeOk = s => typeof s === 'string' && (s === 'auto' || /^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8}){0,3}$/.test(s));

function normSeg(s) {
  if (!isObj(s)) return null;
  const o = {
    id: validId(s.id) ? s.id : newId(), t: num(s.t, 0), src: str(s.src), dst: str(s.dst),
    status: ['ok', 'failed', 'pending'].includes(s.status) ? s.status : 'ok',
  };
  if (s.who === 'me' || s.who === 'partner') o.who = s.who;
  if (typeof s.provider === 'string' && s.provider) o.provider = s.provider.slice(0, 40);
  if (s.partial === true) o.partial = true;
  return o;
}
/* 回傳乾淨的紀錄；不合格回傳 null。墓碑（已刪除）回傳 {id,deleted:true,...} */
function normRecord(raw) {
  if (!isObj(raw) || !validId(raw.id)) return null;
  if (raw.deleted === true) return { id: raw.id, deleted: true, updated: num(raw.updated), mode: raw.mode === 'unshare' ? 'unshare' : 'del', kind: KINDS.includes(raw.kind) ? raw.kind : 'single' };
  if (!KINDS.includes(raw.kind)) return null;
  const segs = [];
  if (Array.isArray(raw.segments)) for (const s of raw.segments.slice(0, MAX_SEGS)) { const n = normSeg(s); if (n) segs.push(n); }
  const r = {
    id: raw.id, kind: raw.kind, schema: SCHEMA,
    created: num(raw.created, Date.now()), updated: num(raw.updated, Date.now()), rev: Math.max(0, Math.floor(num(raw.rev, 0))),

      if (n.deleted) { R.delete(id); T.set(id, n); known.delete(id); }
      else { T.delete(id); known.set(id, n.rev); const p = pend.get(id); if (p) for (const { fn, at } of p.fns) fn(n, at); R.set(id, n); }

    });
    Bus.emit('recs'); Bus.emit('folder-dirty');
  }
  async function reloadSettings() {
    const d = await backend.transact(['kv'], 'readonly', ops => Promise.all([ops.get('kv', 'settings'), ops.get('kv', 'local')]), { epoch: false }).catch(() => null);
    if (!d) return; adoptSettings(d[0], d[1]); Bus.emit('settings', { external: true }); if (!syncNh()) Bus.emit('folder-dirty');
  }
  async function reloadPhrases() {
    if (syncNh()) return;
    const rows = await backend.transact(['phrases', 'kv'], 'readonly', async ops => [await ops.all('phrases'), await ops.get('kv', 'ptomb')], { epoch: false }).catch(() => null);
    if (!rows) return; P.clear(); for (const r of rows[0]) { const p = normPhrase(r); if (p) P.set(p.id, p); }
    PT.clear(); if (isObj(rows[1])) for (const [k, v] of Object.entries(rows[1])) if (validId(k)) PT.set(k, num(v));
    Bus.emit('phrases'); Bus.emit('folder-dirty');
  }

  /* ---------- 排程與寫入 ---------- */
  /* 合併兩份排隊中的修改（舊的在前、新的在後），刪除與復原的先後順序要正確 */
  function mergePending(a, b) {
    const o = { create: a.create || b.create, fns: a.fns.concat(b.fns), remove: a.remove, restore: a.restore };
    if (b.remove) { o.remove = b.remove; o.restore = false; o.fns = []; }
    if (b.restore) { o.remove = null; o.restore = true; o.create = b.create || o.create; o.fns = b.fns.slice(); }
    return o;
  }
  const emptyP = () => ({ create: null, fns: [], remove: null, restore: false });
  function mark(id, patch) {
    pend.set(id, mergePending(pend.get(id) || emptyP(), { ...emptyP(), ...patch }));
    st.pending = pend.size + pendKV.size;
  }
  const hasPending = () => pend.size > 0 || pendKV.size > 0 || Object.keys(pSet).length > 0 || Object.keys(pLoc).length > 0;
  function schedule() {
    if (st.stale) return;
    const now = Date.now(); if (!firstAt) firstAt = now;
    clearTimeout(timer);
    timer = setTimeout(() => { flush().catch(() => {}); }, clamp(firstAt + 3000 - now, 0, 300));
    st.pending = pend.size + pendKV.size; Bus.emit('status');
  }
  function mutate(id, fn, create) {
    if (st.stale) return null;
    const nh = syncNh(); const at = Date.now();
    let rec = R.get(id), initial = null;
    if (!rec) {
      if (!create) return null;
      rec = normRecord(create); if (!rec || rec.deleted) return null;
      rec.updated = at; initial = clone(rec); R.set(id, rec);
    }
    fn(rec, at); rec.updated = Math.max(rec.updated, at);
    if (!nh) { mark(id, { create: initial, fns: [{ fn, at }] }); schedule(); }
    Bus.emit('rec', id); if (initial) Bus.emit('recs'); Bus.emit('folder-dirty');
    return rec;
  }
  function create(kind, fields) {
    const id = newId(), now = Date.now();
    const rec = Object.assign({ id, kind, schema: SCHEMA, created: now, updated: now, rev: 0, title: '', starred: false, srcLang: 'auto', dstLang: '', state: 'done', segments: [], install: local.installId }, fields || {});
    return mutate(id, () => {}, rec) && id;
  }
  function remove(id) {
    const rec = R.get(id); if (!rec) return { ok: false, reason: 'missing' };
    if (rec.state === 'open' && (rec.owner === tabId || Date.now() - (rec.ownerBeat || 0) < 15000)) return { ok: false, reason: 'recording' };
    const nh = syncNh(); const at = Date.now();
    R.delete(id); known.delete(id); T.set(id, { id, deleted: true, updated: at, mode: 'del', kind: rec.kind });
    if (!nh) { mark(id, { remove: { at, kind: rec.kind } }); schedule(); }
    Bus.emit('rec', id); Bus.emit('recs'); Bus.emit('folder-dirty');
    return { ok: true, rec: clone(rec) };
  }
  function restore(rec) {
    const n = normRecord(rec); if (!n || n.deleted) return;
    const nh = syncNh(); T.delete(n.id); n.updated = Date.now(); R.set(n.id, n);
    if (!nh) { mark(n.id, { create: clone(n), restore: true }); schedule(); }
    Bus.emit('rec', n.id); Bus.emit('recs'); Bus.emit('folder-dirty');
  }

  async function commitBatch(be, recs, kvs, setP, locP) {
    return be.transact(['records', 'kv'], 'readwrite', async ops => {
      const out = new Map(); const res = {};
      for (const [id, p] of recs) {
        const latestRaw = await ops.get('records', id);
        const latest = latestRaw ? normRecord(latestRaw) : null;
        if (p.remove) {
          if (latest && latest.deleted) { out.set(id, { deleted: true }); continue; }
          const tomb = { id, deleted: true, updated: p.remove.at, mode: 'del', kind: p.remove.kind || (latest ? latest.kind : 'single') };
          await ops.put('records', tomb); out.set(id, { deleted: true, tomb }); continue;
        }
        let base = latest && !latest.deleted ? latest : null, applied = false;
        if (p.restore && p.create) base = clone(p.create);                 // 「復原刪除」：以復原當下的完整內容為準（資料庫那列可能仍是刪除前的舊版）
        if (!base) {
          if (latest && latest.deleted && !p.restore) { out.set(id, { gone: true }); continue; }
          if (p.create) base = clone(p.create);
          else if (R.get(id)) { base = clone(R.get(id)); applied = true; }          // 資料庫裡沒有這一列但畫面上有：把畫面上的版本寫進去，絕不丟掉修改
          else { out.set(id, { gone: true }); continue; }
        }
        const dbRev = latest && !latest.deleted ? latest.rev : 0;
        if (!applied) for (const { fn, at } of p.fns) { fn(base, at); base.updated = Math.max(base.updated, at); }
        base.rev = dbRev + 1;
        await ops.put('records', base); out.set(id, { rec: base, dbRev });
      }
      for (const [k, v] of kvs) await ops.put('kv', v, k);
      if (Object.keys(setP).length) res.settings = await mergePatch(ops, 'settings', setP);
      if (Object.keys(locP).length) res.local = await mergePatch(ops, 'local', locP);
      return { out, res };
    });
  }
  async function mergePatch(ops, name, patch) {
    const v = {}, t = {}; for (const [k, e] of Object.entries(patch)) { v[k] = e.v; t[k] = e.t; }
    return mergeKvTx(ops, name, v, t);
  }
  async function flush() {
    clearTimeout(timer); timer = null;

    if (syncNh()) { pend.clear(); pendKV.delete('draft'); }          // 不留紀錄：任何文字都不寫（寫入當下才檢查）
    if (!hasPending() || st.stale) return;
    const recs = new Map(pend), kvs = new Map(pendKV), setP = pSet, locP = pLoc;
    pend.clear(); pendKV.clear(); pSet = {}; pLoc = {}; firstAt = 0;
    st.saving = true; inflight = recs; Bus.emit('status');
    flushing = (async () => {
      let r = null, err = null;
      try { r = await commitBatch(backend, recs, kvs, setP, locP); } catch (e) { err = e; }
      if (r) {
        st.error = ''; st.errorDetail = ''; st.lastSavedAt = Date.now(); retryN = 0; clearTimeout(retryTimer); inflight = null; writeEmergency();   // 只有「這一批已確認寫入」且沒有別的待寫內容，急救副本才會被清掉
        const touched = [];
        for (const [id, o] of r.out) {
          if (o.rec) {
            const cur = R.get(id);
            if (o.dbRev !== (known.get(id) || 0) && o.dbRev !== 0) { const q = pend.get(id); if (q) for (const { fn, at } of q.fns) fn(o.rec, at); R.set(id, o.rec); Bus.emit('rec', id); }
            else if (cur) cur.rev = o.rec.rev;
            known.set(id, o.rec.rev); touched.push(id);
          } else if (o.deleted) touched.push(id);
          else if (o.gone && T.has(id)) { R.delete(id); Bus.emit('rec', id); }
        }
        if (r.res.settings || r.res.local) { adoptSettings(r.res.settings || { v: shared, t: sharedT }, r.res.local || { v: local, t: localT }); post({ type: 'settings' }); }
        if (touched.length) post({ type: 'rec', ids: touched });

      } else if (err instanceof StaleError) markStale('epoch');
      else {
        // 寫入失敗：內容放回佇列、大聲顯示「沒存到」、持續重試；不切換到別的後端，也絕不顯示已儲存
        for (const [id, p] of recs) pend.set(id, mergePending(p, pend.get(id) || emptyP()));
        for (const [k, v] of kvs) if (!pendKV.has(k)) pendKV.set(k, v);
        for (const [k, e] of Object.entries(setP)) if (!pSet[k]) pSet[k] = e;
        for (const [k, e] of Object.entries(locP)) if (!pLoc[k]) pLoc[k] = e;
        inflight = null; st.error = 'write'; st.errorDetail = String((err && err.message) || err); writeEmergency();
        retryN++; clearTimeout(retryTimer);
        retryTimer = setTimeout(() => { flush().catch(() => {}); }, Math.min(8000, 2000 * 2 ** Math.min(retryN, 2)));
        Bus.emit('notify', { key: 'save_failed', type: 'err', once: 'save_failed' });
      }
    })();
    try { await flushing; } finally { inflight = null; flushing = null; st.saving = false; st.pending = pend.size + pendKV.size; Bus.emit('status'); }

  }
  /* 離開頁面前：同步寫一份急救副本，再盡力寫入（寫入確認後急救副本才會被刪） */
  function flushOnHide() {
    if (st.stale || syncNh()) return;
    writeEmergency();
    flush().catch(() => {});
  }
  async function enforceLimits() {
    if (st.noHistory) return;
    const singles = [...R.values()].filter(r => r.kind === 'single' && !r.starred).sort((a, b) => b.updated - a.updated);
    const extra = singles.slice(SINGLE_LIMIT);
    if (extra.length) {
      for (const r of extra) { R.delete(r.id); known.delete(r.id); }
      await backend.transact(['records'], 'readwrite', async ops => { for (const r of extra) await ops.del('records', r.id); }).catch(() => {});
      Bus.emit('recs');
    }
    const old = Date.now() - 180 * 86400000;
    for (const [id, tm] of T) if (tm.updated < old) T.delete(id);
  }

  /* ---------- 設定（共用）、裝置設定、草稿：欄位層級增量 ---------- */
  function putField(name, k, v) {
    const t = Date.now();
    if (name === 'settings') { shared[k] = v; sharedT[k] = t; pSet[k] = { v, t }; } else { local[k] = v; localT[k] = t; pLoc[k] = { v, t }; }
  }
  function setSettings(patch) {
    if (st.stale) return;
    const next = normSettings({ ...sv, ...patch });
    const changed = Object.keys(next).filter(k => canon(next[k]) !== canon(sv[k]));
    if (!changed.length) return;
    for (const k of changed) putField(LOCALISH.includes(k) ? 'local' : 'settings', k, next[k]);
    rebuildView(); if (changed.includes('customLangs')) setCustomLangs(sv.customLangs);
    schedule(); Bus.emit('settings', { changed }); if (changed.some(k => SHARED_KEYS.includes(k)) && !syncNh()) Bus.emit('folder-dirty');
  }
  function touchShared() { for (const k of SHARED_KEYS) putField('settings', k, shared[k]); schedule(); }   // 讓目前的共用設定都成為「最新」（用本機覆蓋資料夾時用）
  function setLocal(patch) {
    if (st.stale) return;
    const next = normLocal({ ...local, ...patch });
    const changed = Object.keys(next).filter(k => canon(next[k]) !== canon(local[k]));
    if (!changed.length) return;
    for (const k of changed) putField('local', k, next[k]);
    rebuildView(); schedule(); Bus.emit('settings', { changed: ['local'] });
  }
  function setDraft(d) { draft = d; if (st.stale || syncNh()) return; pendKV.set('draft', d); schedule(); }
  async function kvGet(key) { try { return await backend.transact(['kv'], 'readonly', ops => ops.get('kv', key)); } catch (e) { if (e instanceof StaleError) markStale('epoch'); return undefined; } }
  async function kvPut(key, val) {
    if (st.stale) throw new StaleError();
    try { await backend.transact(['kv'], 'readwrite', ops => ops.put('kv', val, key)); }
    catch (e) { if (e instanceof StaleError) markStale('epoch'); throw e; }
  }
  /* 刪除要從「每一個」可能存放的地方刪；回傳是否真的刪乾淨（呼叫者要據實告訴使用者） */
  async function kvDel(key) {
    let ok = true;
    try { await backend.transact(['kv'], 'readwrite', ops => ops.del('kv', key)); } catch (e) { if (e instanceof StaleError) markStale('epoch'); ok = false; }
    if (!lsDel('kv:' + key)) ok = false;
    return ok;
  }

  /* ---------- 我的收藏／名詞表（刪除留下標記，才不會被另一台復原） ---------- */
  async function putPhrase(p) {
    const n = normPhrase({ ...p, id: p.id || newId(), updated: Date.now() }); if (!n || st.stale) return null;
    P.set(n.id, n); PT.delete(n.id);
    if (!syncNh()) await commitDirect({ phrases: [n] });
    Bus.emit('phrases'); if (!st.noHistory) Bus.emit('folder-dirty'); return n;
  }
  async function delPhrase(id) {
    if (!P.delete(id) || st.stale) return;
    const at = Date.now(); PT.set(id, at);
    if (!syncNh()) await commitDirect({ delPhrases: [id], ptomb: { [id]: at } });
    Bus.emit('phrases'); if (!st.noHistory) Bus.emit('folder-dirty');
  }

  /* ---------- 直接寫入（匯入、還原、資料夾同步、清除用）：先把排隊的寫完 ---------- */
  async function commitDirect({ recs = [], tombs = [], hard = [], phrases = [], delPhrases = [], ptomb = null, kvPatches = [] }) {
    await flush();
    if (syncNh()) return;
    if (st.stale) throw new StaleError();
    try {
      await backend.transact(['records', 'phrases', 'kv'], 'readwrite', async ops => {
        for (const r of recs) await ops.put('records', r);
        for (const x of tombs) await ops.put('records', x);
        for (const id of hard) await ops.del('records', id);
        for (const p of phrases) await ops.put('phrases', p);
        for (const id of delPhrases) await ops.del('phrases', id);
        if (ptomb) { const cur = (await ops.get('kv', 'ptomb')) || {}; for (const [k, v] of Object.entries(ptomb)) if (num(v) > num(cur[k])) cur[k] = v; await ops.put('kv', cur, 'ptomb'); }
        for (const [name, v, t] of kvPatches) await mergeKvTx(ops, name, v, t);
      });
    } catch (e) {
      if (e instanceof StaleError) { markStale('epoch'); throw e; }
      st.error = 'write'; st.errorDetail = String((e && e.message) || e); Bus.emit('status'); Bus.emit('notify', { key: 'save_failed', type: 'err', once: 'save_failed' }); throw e;
    }
    st.error = ''; st.lastSavedAt = Date.now();
    const ids = [...recs.map(r => r.id), ...tombs.map(x => x.id), ...hard];
    if (ids.length) post({ type: 'rec', ids });
    if (phrases.length || delPhrases.length) post({ type: 'phrases' });
    if (kvPatches.length) post({ type: 'settings' });
    Bus.emit('status');
  }
  async function applyExternal(recs, tombs = [], hard = []) {
    const put = [], tb = [];
    for (const raw of recs) { const n = normRecord(raw); if (!n || n.deleted) continue; put.push(n); }
    for (const raw of tombs) { const n = normRecord(raw); if (!n || !n.deleted) continue; tb.push(n); }
    await commitDirect({ recs: put, tombs: tb, hard });
    for (const n of put) { T.delete(n.id); R.set(n.id, n); known.set(n.id, n.rev); pend.delete(n.id); }
    for (const n of tb) { R.delete(n.id); known.delete(n.id); T.set(n.id, n); pend.delete(n.id); }
    for (const id of hard) { R.delete(id); known.delete(id); pend.delete(id); }
    Bus.emit('recs'); put.forEach(r => Bus.emit('rec', r.id));
  }
  /* 資料夾合併後的結果（共用設定的每個欄位＋名詞表＋名詞刪除標記）寫回本機 */
  async function applySettingsMerged(m) {
    const list = (m.phrases || []).map(normPhrase).filter(Boolean);
    const gone = [...P.keys()].filter(id => !list.some(p => p.id === id));
    const ptomb = {}; for (const [k, v] of Object.entries(m.ptomb || {})) if (validId(k)) ptomb[k] = num(v);
    await commitDirect({ phrases: list, delPhrases: gone, ptomb, kvPatches: [['settings', pickShared(normSettings(m.settings)), m.st || {}]] });
    P.clear(); list.forEach(p => P.set(p.id, p)); for (const [k, v] of Object.entries(ptomb)) PT.set(k, v);
    await reloadSettings(); Bus.emit('phrases');
  }
  const sharedDoc = () => ({ settings: clone(shared), st: { ...sharedT }, phrases: [...P.values()].map(clone), ptomb: Object.fromEntries(PT) });

  /* ---------- 還原點（寫不進去就回報失敗，呼叫者必須中止） ---------- */
  const snapshotData = () => ({ records: [...R.values()].map(clone), phrases: [...P.values()].map(clone), settings: clone(shared) });
  async function makeSnapshot(reason, kind = 'event', extra) {
    if (st.noHistory || st.stale) return null;
    const data = snapshotData(); if (extra) data.records.push(...extra);
    const at = Date.now();
    const snap = { id: (kind === 'day' ? 'day-' + dayStamp() : 'evt-' + minuteStamp() + '-' + at % 100000 + '-' + Math.floor(Math.random() * 1000)), at, kind, reason, counts: { records: data.records.length, phrases: data.phrases.length }, data };
    try {
      await backend.transact(['snapshots'], 'readwrite', async ops => {
        if (!(kind === 'day' && await ops.get('snapshots', snap.id))) await ops.put('snapshots', snap);
        const all = await ops.all('snapshots');
        const days = all.filter(s => s.kind === 'day').sort((a, b) => b.at - a.at).slice(7);
        const evts = all.filter(s => s.kind !== 'day').sort((a, b) => b.at - a.at).slice(10);
        for (const s of [...days, ...evts]) await ops.del('snapshots', s.id);
      });
      Bus.emit('snapshots'); return snap.id;
    } catch (e) { if (e instanceof StaleError) markStale('epoch'); return null; }
  }
  /* 會覆蓋資料的動作先呼叫這個：沒有還原點就丟出錯誤，動作不會執行 */
  async function snapshotOrThrow(reason) {
    if (st.noHistory) throw Object.assign(new Error('nohist'), { code: 'nohist' });
    const id = await makeSnapshot(reason);
    if (!id) { Bus.emit('notify', { key: 'snapshot_failed', type: 'err' }); throw Object.assign(new Error('snapshot'), { code: 'snapshot' }); }
    return id;
  }
  let lastDaily = '';
  async function dailySnapshot() { const d = dayStamp(); if (lastDaily === d || (!R.size && !P.size)) return; lastDaily = d; await makeSnapshot('daily', 'day'); }
  const listSnapshots = async () => { try { return (await backend.transact(['snapshots'], 'readonly', ops => ops.all('snapshots'), { epoch: false })).sort((a, b) => b.at - a.at); } catch (_) { return []; } };
  async function getSnapshot(id) { try { return await backend.transact(['snapshots'], 'readonly', ops => ops.get('snapshots', id), { epoch: false }); } catch (_) { return null; } }

  /* ---------- 匯出／匯入（不含金鑰與裝置設定） ---------- */
  function exportBundle() { return { app: APP_ID, kind: 'export', schema: SCHEMA, appVersion: APP_VERSION, exportedAt: Date.now(), device: local.deviceName || '', settings: clone(shared), phrases: [...P.values()].map(clone), records: [...R.values()].map(clone) }; }
  const MAX_IMPORT_BYTES = 80 * 1024 * 1024;
  function parseBundle(obj) {
    if (!isObj(obj) || obj.app !== APP_ID || obj.kind !== 'export') return { ok: false, reason: 'format' };
    if (num(obj.schema) > SCHEMA) return { ok: false, reason: 'newer' };
    const records = [], phrases = []; let rejected = 0;
    for (const r of Array.isArray(obj.records) ? obj.records.slice(0, 50000) : []) { const n = normRecord(r); if (n && !n.deleted) records.push(n); else rejected++; }
    for (const p of Array.isArray(obj.phrases) ? obj.phrases.slice(0, 5000) : []) { const n = normPhrase(p); if (n) phrases.push(n); else rejected++; }
    return { ok: true, records, phrases, settings: isObj(obj.settings) ? pickShared(normSettings(obj.settings)) : null, rejected };
  }
  async function importBundle(parsed, mode) {
    await snapshotOrThrow('before_import');
    const now = Date.now(); const put = [], tombs = [];
    const settingsPatch = () => { if (!parsed.settings) return []; const t = {}; for (const k of SHARED_KEYS) t[k] = now; return [['settings', parsed.settings, t]]; };
    if (mode === 'replace') {
      const ids = new Set(parsed.records.map(r => r.id));
      for (const r of R.values()) if (!ids.has(r.id)) tombs.push({ id: r.id, deleted: true, updated: now, mode: 'del', kind: r.kind });
      for (const r of parsed.records) { const cur = R.get(r.id); r.rev = Math.max(num(cur && cur.rev), r.rev) + 1; r.updated = now; if (r.state === 'open') r.state = 'interrupted'; put.push(r); }
      const gonePh = [...P.keys()].filter(id => !parsed.phrases.some(p => p.id === id));
      const ptomb = {}; for (const id of gonePh) ptomb[id] = now;
      await commitDirect({ recs: put, tombs, phrases: parsed.phrases, delPhrases: gonePh, ptomb, kvPatches: settingsPatch() });
      for (const tb of tombs) { R.delete(tb.id); known.delete(tb.id); T.set(tb.id, tb); }
      for (const r of put) { R.set(r.id, r); known.set(r.id, r.rev); T.delete(r.id); }
      P.clear(); parsed.phrases.forEach(p => P.set(p.id, p)); for (const [k, v] of Object.entries(ptomb)) PT.set(k, v);
    } else {
      for (const r of parsed.records) {
        const cur = R.get(r.id), tomb = T.get(r.id);
        if (tomb && tomb.updated >= r.updated) continue;
        if (r.state === 'open') r.state = 'interrupted';
        if (!cur) { r.rev = Math.max(r.rev, 1); put.push(r); }

/* =====================================================================
   12 API 金鑰與舊版設定搬移
   金鑰只放在專屬的本機「祕密欄位」（kv 的 secret），
   絕不進資料夾、匯出、還原點、跨分頁廣播、紀錄、日誌或錯誤訊息。
   ===================================================================== */
const Secret = (() => {
  let memKey = '';
  const remember = () => Store.local.rememberKey !== false;
  /* 撤銷標記：在 localStorage「同步」寫入、先於任何刪除動作；只有確認刪乾淨或使用者明確重新開啟才清除。
     只要標記還在，就不載入金鑰、不顯示「記住」，並重試刪除（即使資料庫當時寫不進去也不會讓金鑰復活） */
  const revoked = () => Store.lsGet('keyrevoked');
  async function load() {
    const m = revoked();
    if (m) {
      memKey = '';
      if (m === 'off' && remember()) Store.setLocal({ rememberKey: false });
      if (await wipe(true)) Store.lsDel('keyrevoked');
      return;
    }
    if (!remember()) { memKey = ''; return; }
    const v = await Store.kvGet('secret');
    memKey = v && typeof v.key === 'string' ? v.key : '';
  }
  async function persist() {
    if (memKey) { await Store.kvPut('secret', { key: memKey, at: Date.now() }); Store.lsDel('keyrevoked'); Store.post({ type: 'secret' }); }
    else await wipe();
  }
  /* 從每一個可能存放的地方刪除（資料庫、localStorage 後援、舊版 tt_gemkey）；刪不乾淨要據實告知 */
  async function wipe(quiet) {
    let ok = await Store.kvDel('secret');
    if (ok && (await Store.kvGet('secret')) !== undefined) ok = false;            // 讀回確認真的沒了
    try { localStorage.removeItem('tt_gemkey'); if (localStorage.getItem('tt_gemkey') != null) ok = false; } catch (_) { ok = false; }
    if (Store.lsGet('kv:secret') != null) ok = false;
    Store.post({ type: 'secret' });
    if (!ok && !quiet) Bus.emit('notify', { key: 'key_delete_failed', type: 'err' });
    return ok;
  }
  async function set(key) {
    memKey = String(key || '').trim();
    try { if (remember()) await persist(); } catch (e) { Bus.emit('notify', { key: 'key_save_failed', type: 'err' }); }
  }
  async function setRemember(on) {
    if (on) Store.lsDel('keyrevoked'); else Store.lsSet('keyrevoked', 'off');       // 先寫撤銷標記，再做任何事
    Store.setLocal({ rememberKey: !!on });                         // 欄位層級寫入，不會蓋掉別的分頁的設定
    try { await Store.flush(); } catch (_) {}
    if (on) { try { if (memKey) await persist(); } catch (_) {} }
    else if (await wipe()) Store.lsDel('keyrevoked');              // 取消勾選＝刪除所有已保存的副本，只留在這個頁面的記憶體
    Store.post({ type: 'secret' }); Bus.emit('secret');
  }
  async function clear() { Store.lsSet('keyrevoked', 'del'); memKey = ''; if (await wipe()) Store.lsDel('keyrevoked'); Bus.emit('secret'); }
  /* 別的分頁改了金鑰或「記住」：這個分頁丟掉記憶體裡可持久化的那份，重新讀 */
  async function reload() { await load(); Bus.emit('secret'); }
  const memClear = () => { memKey = ''; };
  return { get: () => memKey, load, set, setRemember, clear, reload, remember, memClear };
})();

/* 舊版（v3.1）的九個 tt_* 鍵：只搬一次，比對一致才算成功；之後使用者清掉的東西不會再被「復活」 */
const Migration = (() => {
  async function run() {
    if (Store.lsGet('migrated') === '1' || await Store.kvGet('migrated')) return 'done';
    const legacy = {};
    for (const k of Store.LEGACY_KEYS) { try { const v = localStorage.getItem(k); if (v != null) legacy[k] = v; } catch (_) {} }
    const markDone = async () => { Store.lsSet('migrated', '1'); try { await Store.kvPut('migrated', { at: Date.now() }); } catch (_) {} };
    if (!Object.keys(legacy).length) { await markDone(); return 'none'; }
    const patch = {}, localPatch = {};
    if (legacy.tt_theme === 'dark' || legacy.tt_theme === 'light') patch.theme = legacy.tt_theme;
    if (legacy.tt_autospeak != null) patch.autoSpeak = legacy.tt_autospeak === '1';
    if (legacy.tt_automode != null) patch.autoMode = legacy.tt_automode !== '0';
    if (legacy.tt_zoomfont) patch.zoomFont = parseInt(legacy.tt_zoomfont, 10) || 48;
    if (legacy.tt_gemmodel) patch.gemModel = legacy.tt_gemmodel;
    if (legacy.tt_gemlang) patch.gemTarget = legacy.tt_gemlang === 'pt' ? 'pt-BR' : legacy.tt_gemlang;
    if (legacy.tt_gemsource === 'display' || legacy.tt_gemsource === 'mic') localPatch.gemSource = legacy.tt_gemsource;
    if (legacy.tt_gemoutput != null) localPatch.gemOutput = legacy.tt_gemoutput;
    const applySettings = (await Store.kvGet('settings')) === undefined;
    if (applySettings) Store.setSettings(patch);
    Store.setLocal({ ...localPatch, rememberKey: true });          // 舊版金鑰預設沿用並記住，不再詢問
    const key = (legacy.tt_gemkey || '').trim();
    if (key) { await Secret.set(key); }
    await Store.flush();
    // 讀回比對
    let ok = true;
    const back = await Store.kvGet('settings'), backLocal = await Store.kvGet('local');
    if (applySettings) for (const [k, v] of Object.entries(patch)) {
      const row = LOCALISH.includes(k) ? backLocal : back;
      if (!row || !row.v || canon(SETTING_RULES[k](v)) !== canon(row.v[k])) ok = false;
    }
    for (const [k, v] of Object.entries(localPatch)) if (!backLocal || !backLocal.v || backLocal.v[k] !== normLocal({ [k]: v })[k]) ok = false;
    if (key) { const sec = await Store.kvGet('secret'); if (!sec || sec.key !== key) ok = false; }
    if (Store.st.error) ok = false;
    if (!ok) { Bus.emit('notify', { key: 'migrate_failed', type: 'err' }); return 'failed'; }   // 舊資料原封不動，下次再試
    await markDone();
    for (const k of Store.LEGACY_KEYS) { try { localStorage.removeItem(k); } catch (_) {} }
    Bus.emit('notify', { key: 'migrated_ok', type: 'ok' });
    return 'migrated';
  }
  return { run };
})();
S('migrate_failed', '舊版設定搬移後比對不一致，已保留原資料，下次開啟會再試一次。', 'Migrating your old settings did not verify. The old data was left untouched and will be retried next time.');

/* =====================================================================
   15 資料夾長期儲存（第二版：每次同步都是「一個有世代的工作階段」）
   <選的資料夾>/翻譯工具資料/
        設定與收藏.json               共用設定（每個欄位有時間戳）、名詞表、刪除標記

   - 刪除標記先寫進設定檔，成功後才移除檔案。
   - 設定是「每個欄位取最新時間戳」、名詞表以 id 合併（含刪除標記），永遠不會跳出對話框。
   - 衝突（同一筆紀錄兩邊都改）才詢問；決定時針對「對話框顯示的那個版本」，

  async function recDirOf(root, ym, create) { const rd = await subDir(root, REC_DIR, create); return rd ? subDir(rd, ym, create) : null; }

  /* ---------- 檔案內容 ---------- */
  const fileStem = r => minuteStamp(new Date(r.created || Date.now())) + '_' + (KIND_LABEL[r.kind] || r.kind) + '_' + r.id;

  async function safeRemove(S, id, path, knownUpdated) {

/* =====================================================================
   20 翻譯服務層
   - providers 是一個陣列，要換掉或加入別的翻譯服務只改這裡。
   - 每個服務自己負責：語言代碼、單次長度上限、回應驗證。
   - 逾時、同時最多 4 個請求、暫時性錯誤重試一次、錯誤絕不快取。
   - 長文先依換行合併成段落，過長再依標點、最後依「碼位」切，
     MyMemory 的上限是 500 個 UTF-8「位元組」。

   ===================================================================== */
const MAX_CONCURRENT = 4, REQ_TIMEOUT_MS = 12000;

const providers = [
  {
    id: 'google', name: 'Google 翻譯', nameEn: 'Google Translate', unofficial: true,
    measure: uriLen, limit: 2800, cooldownUntil: 0,
    supports: () => true,
    async translate(text, from, to, signal) {
      const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + encodeURIComponent(langInfo(from).g) + '&tl=' + encodeURIComponent(langInfo(to).g) + '&dt=t&q=' + encodeURIComponent(text);

/* 同時請求上限 */

/* ---------- 送出前遮蔽（選用，預設關閉）：電話、Email、證件號碼 ----------

/* 偵測前先把全形字元轉成半形（長度不變，所以位置對得上），遮蔽時改寫原文 */

  [/(?<!\d)\d{3}-\d{2}-\d{4}(?!\d)/g, '[ID]'],                                      // 美國社會安全號碼格式

/* 依「行」合併成段落（不超過上限），每個片段記住後面接的分隔符，串回去等於原文結構 */
function planChunks(text, measure, limit) {
  const lines = text.split('\n');
  const chunks = []; let cur = [], curText = '';
  const flush = after => { if (cur.length) { chunks.push({ src: cur.join('\n'), after }); cur = []; curText = ''; } };
  lines.forEach((line, i) => {
    const isLast = i === lines.length - 1;
    if (measure(line) > limit) {
      flush('\n');
      const parts = splitLong(line, measure, limit);
      parts.forEach((p, j) => chunks.push({ src: p, after: j < parts.length - 1 ? '' : (isLast ? '' : '\n'), piece: true }));
      return;
    }
    const joined = cur.length ? curText + '\n' + line : line;
    if (cur.length && measure(joined) > limit) { flush('\n'); cur.push(line); curText = line; }

/* 單一片段：依序嘗試每個服務；暫時性錯誤重試一次 */
async function translateChunk(src0, from, to, signal) {
  if (!src0.trim()) return { ok: true, dst: src0, provider: null };
  const src = maskText(src0);                                                      // 之後所有送出、快取都用遮蔽後的文字

    const pieces = p.measure(src) > p.limit ? splitLong(src, p.measure, p.limit) : [src];

      const core = piece.slice(0, piece.length - trailing.length);
      if (!core) { outTxt += piece; continue; }
      let res = null;
      for (let attempt = 0; attempt < 2 && !res; attempt++) {
        const ac = new AbortController();
        const onAbort = () => ac.abort();
        if (signal) { if (signal.aborted) throw Object.assign(new Error('aborted'), { name: 'AbortError' }); signal.addEventListener('abort', onAbort, { once: true }); }

        catch (e) {
          if (signal && signal.aborted) throw Object.assign(new Error('aborted'), { name: 'AbortError' });

      const nIn = src.split('\n').length;

const Translate = {

  /* 回傳 {parts:[{src,dst,ok,after,provider,err}], text, provider, detected, failed} */
  async run(text, from, to, { signal } = {}) {

    if (from !== 'auto' && sameLang(from, to) && from === to) return { parts: [{ src: text, dst: text, ok: true, after: '' }], text, provider: null, detected: null, failed: 0 };

      const r = await translateChunk(p.src, from, to, signal);
      return { ...p, dst: r.ok ? r.dst : '', ok: r.ok, provider: r.provider || null, err: r.ok ? null : classifyErr(r.err), detected: r.detected || null };

const track = p => { inflightWork.add(p); p.finally(() => inflightWork.delete(p)); return p; };
const settle = () => Promise.allSettled([...inflightWork]);
const sttLang = c => langInfo(c).stt;
function needLang(code) {
  if (code === 'auto') { Bus.emit('notify', { key: 'need_lang', type: 'err' }); return false; }
  if (!sttLang(code)) { Bus.emit('notify', { key: 'no_stt_lang', params: { lang: langName(code, false) }, type: 'err' }); return false; }
  return true;
}
S('need_lang', '語音功能需要明確指定說話的語言，請先選擇語言（不能用「自動偵測」）。', 'Voice features need a specific spoken language. Please choose one (not "Auto-detect").');
S('no_stt_lang', '「{lang}」沒有語音輸入支援，請改用打字，或換一種語言。', '"{lang}" has no voice input here. Type instead, or choose another language.');
const waitAlive = (ctx, ms) => new Promise(res => { const un = ctx.own(() => res(false)); ctx.later(ms, () => { un(); res(true); }); });
async function keepAwake(ctx) {
  if (!navigator.wakeLock || !navigator.wakeLock.request) return;
  let lock = null;
  const get = async () => { try { lock = await navigator.wakeLock.request('screen'); if (!ctx.alive()) { lock.release(); lock = null; } } catch (_) {} };
  ctx.own(() => { try { lock && lock.release(); } catch (_) {} lock = null; });
  const prev = ctx.onVisible; ctx.onVisible = () => { if (prev) prev(); if (!lock) get(); };
  get();
}

/* 把一段辨識到的文字翻譯後寫進指定紀錄的指定片段（不管場次是否還活著） */
async function translateIntoSeg(rid, sid, text, from, to) {
  try {
    const res = await Translate.run(text, from, to);
    if (res.failed) { Rec.patchSeg(rid, sid, { status: 'failed', dst: '' }); Bus.emit('notify', { key: 'err_' + firstErr(res), type: 'err', once: 'segfail' }); }
    else Rec.patchSeg(rid, sid, { status: 'ok', dst: res.text, provider: res.provider || undefined });
    return res;
  } catch (e) { Rec.patchSeg(rid, sid, { status: 'failed' }); return null; }
}

/* 辨識結束時帶著暫時性錯誤（網路等）而沒有任何結果：不能說「沒聽到」，要說連不上 */
const recErrKey = e => (e === 'network' ? 'rec_network' : 'rec_error');
S('rec_network', '無法連上語音辨識服務，請檢查網路後再試。', 'Could not connect to the speech recognition service. Check your connection and try again.');
S('rec_error', '語音辨識出了問題，請再試一次。', 'Speech recognition had a problem. Please try again.');
/* ---------- 單次聽寫（翻譯頁、多語言卡片的 🎤） ---------- */
const Dictate = {
  start({ lang, onInterim, onFinal, onEnd }) {
    if (!needLang(lang)) return null;
    const ctx = VC.begin('dictate', { label: 'dictate' }); if (!ctx) return null;
    const h = recognize(ctx, {
      lang: sttLang(lang), continuous: false, onStart: () => ctx.set('listening'),
      onInterim: tx => { if (onInterim) onInterim(tx); },
      onFinal: tx => { if (onFinal) onFinal(tx); },
      onEnd: info => { if (info && !info.gotResult && info.error) Bus.emit('notify', { key: recErrKey(info.error), type: 'err', once: 'recerr' }); ctx.stop('done'); if (onEnd) onEnd(); },
    });
    if (h) ctx.own(() => h.abort());
    return ctx;
  },
};

/* ---------- 面對面 ---------- */
const Face = (() => {
  let convId = null, lastAt = 0;
  const IDLE_NEW_MS = 2 * 3600 * 1000;
  function ensureConv(me, partner) {
    if (!convId || !Store.get(convId) || Date.now() - lastAt > IDLE_NEW_MS) convId = Rec.create('conversation', { srcLang: me, dstLang: partner });
    lastAt = Date.now(); return convId;
  }
  async function exchange(text, who, from, to, me, partner) {
    const rid = ensureConv(me, partner);
    const sid = Rec.addSeg(rid, { src: text, dst: '', who, status: 'pending' });
    Bus.emit('face-exchange', { rid, sid, who });
    const res = await track(Translate.run(text, from, to));
    Rec.patchSeg(rid, sid, res.failed ? { status: 'failed', dst: '' } : { status: 'ok', dst: res.text, provider: res.provider || undefined });
    if (res.failed) Bus.emit('notify', { key: 'err_' + firstErr(res), type: 'err', once: 'facefail' });
    Bus.emit('face-exchange', { rid, sid, who, done: true });
    return res;
  }
  const speakAsync = (ctx, text, lang) => new Promise(res => { const un = ctx.own(() => res(false)); Tts.speak(text, lang, { onDone: () => { un(); res(true); } }); });
  /* 聽一句：回傳最終文字、'' 表示沒聽到、null 表示被切換/取消 */
  function listenOnce(ctx, lang) {
    return new Promise(resolve => {
      let text = '', settled = false;
      const fin = v => { if (!settled) { settled = true; resolve(v); } };
      const h = recognize(ctx, {
        lang: sttLang(lang), continuous: false, onStart: () => ctx.set('listening'),
        onInterim: tx => Bus.emit('face-interim', { side: ctx.side, text: tx }),
        onFinal: tx => { text += tx; },
        onEnd: info => { ctx.lastRecErr = (info && !info.gotResult && info.error) || ''; fin(text.trim()); },
      });
      if (!h) { fin(null); return; }
      ctx.rec = h; const un = ctx.own(() => { h.abort(); fin(null); });
      h.done.then(() => { un(); });
      ctx.abortListen = () => { h.abort(); fin(null); };
    });
  }
  /* 輪流／循環：一直聽→翻譯→（朗讀）→再聽，直到停止 */
  async function turnLoop(ctx, cfg) {
    while (ctx.alive()) {
      const turn = cfg.turn(ctx);
      ctx.side = turn.side; Bus.emit('face-side', turn.side);
      const text = await listenOnce(ctx, turn.from);
      if (!ctx.alive()) return;
      if (text === null) continue;                              // 被切換對象，重新聽
      if (!text) { if (ctx.lastRecErr) Bus.emit('notify', { key: recErrKey(ctx.lastRecErr), type: 'err', once: 'recerr' }); if (!(await waitAlive(ctx, ctx.recFails ? Math.min(4000, 300 * 2 ** (ctx.recFails - 1)) : 350))) return; continue; }
      ctx.set('translating');
      let res; try { res = await exchange(text, turn.who, turn.from, turn.to, cfg.me, cfg.partner); } catch (_) { res = null; }
      if (!ctx.alive()) return;
      if (res && !res.failed && (cfg.alwaysSpeak || Store.settings.faceSpeak !== false)) { ctx.set('speaking'); const okSp = await speakAsync(ctx, res.text, turn.to); if (!okSp || !ctx.alive()) return; }
      cfg.after && cfg.after(turn);
      if (!(await waitAlive(ctx, 150))) return;
    }
  }
  async function startMic(ctx, hold) {
    if (!hold) return true;
    try { await ctx.mic({ audio: { echoCancellation: true, noiseSuppression: true } }); return true; }
    catch (e) { if (!(e instanceof CancelError)) ctx.fail(VC.micErrKey(e)); return false; }
  }
  return {
    ensureConv,
    current: () => convId,
    newConversation() { convId = null; Bus.emit('face-conv'); },
    /* 按一下開始聽這一方，講完自動結束；再按一次取消 */
    async press(side, me, partner) {
      const cur = VC.current();
      if (cur && cur.mode === 'handsfree') { if (cur.setSide) cur.setSide(side); return; }
      if (cur && cur.mode === 'ptt' && cur.side === side) { if (cur.state !== 'starting') cur.stop('user'); return; }
      const from = side === 'me' ? me : partner, to = side === 'me' ? partner : me;
      if (!needLang(from)) return;
      const ctx = VC.begin('ptt', { label: 'ptt' }); if (!ctx) return;
      ctx.side = side;
      const text = await listenOnce(ctx, from);
      if (!ctx.alive() || text === null) return;
      if (!text) { if (ctx.lastRecErr) Bus.emit('notify', { key: recErrKey(ctx.lastRecErr), type: 'err' }); else Bus.emit('face-nothing', { side }); ctx.stop('done'); return; }
      ctx.set('translating');
      let res = null; try { res = await exchange(text, side, from, to, me, partner); } catch (_) {}
      if (!ctx.alive()) return;
      if (res && !res.failed && Store.settings.faceSpeak !== false) { ctx.set('speaking'); await speakAsync(ctx, res.text, to); }
      ctx.stop('done');
    },
    /* 免費輪流：依序用「我」「對方」的語言聽。誠實說明：它不是自動判斷誰在說話，
       同一個人連講兩句時，請按一下自己的按鈕切換。 */
    async handsFree(me, partner) {
      const cur = VC.current();
      if (cur && cur.mode === 'handsfree') { if (cur.state !== 'starting') cur.stop('user'); return; }
      if (!needLang(me) || !needLang(partner)) return;
      if (sameLang(me, partner)) { Bus.emit('notify', { key: 'same_lang', type: 'err' }); return; }
      const ctx = VC.begin('handsfree', { label: 'handsfree' }); if (!ctx) return;
      if (!(await startMic(ctx, true))) return;
      let side = 'me';
      ctx.setSide = s => { side = s; if (ctx.abortListen) ctx.abortListen(); };
      keepAwake(ctx);
      turnLoop(ctx, {
        me, partner,
        turn: () => ({ side, who: side, from: side === 'me' ? me : partner, to: side === 'me' ? partner : me }),
        after: () => { side = side === 'me' ? 'partner' : 'me'; },
      });
    },
    /* 單向循環：只聽「來源語言」，翻成「目標語言」並朗讀，再繼續聽 */
    async loop(from, to) {
      const cur = VC.current();
      if (cur && cur.mode === 'loop') { if (cur.state !== 'starting') cur.stop('user'); return; }
      if (!needLang(from)) return;
      if (sameLang(from, to)) { Bus.emit('notify', { key: 'same_lang', type: 'err' }); return; }
      const ctx = VC.begin('loop', { label: 'loop' }); if (!ctx) return;
      if (!(await startMic(ctx, true))) return;
      keepAwake(ctx);
      turnLoop(ctx, { me: from, partner: to, alwaysSpeak: true, turn: () => ({ side: 'me', who: 'me', from, to }) });      // 單向循環的目的就是朗讀譯文，與「自動朗讀」設定無關
    },
    /* 朗讀「靜音」：只跳過目前這一句，之後照常繼續收音 */
    skipSpeech() { Tts.skip(); },
  };
})();
S('same_lang', '來源與目標語言相同，請選兩種不同的語言。', 'The source and target language are the same. Pick two different languages.');

/* ---------- 聽講：逐字稿（只轉文字）、免費字幕（邊聽邊翻） ---------- */
const Listen = (() => {
  let current = null;
  const stateOf = () => current;
  function commit(L, tx) {
    const text = String(tx || '').trim(); if (!text) return;
    L.interim = ''; L.preview = '';
    const sid = Rec.addSeg(L.rid, { src: text, dst: '', status: L.kind === 'listen' ? 'pending' : 'ok' });
    if (L.kind === 'listen') {
      const p = translateIntoSeg(L.rid, sid, text, L.from, L.to).then(res => { if (res && !res.failed) speakCaption(L, res.text); return res; }).finally(() => L.inflight.delete(p));
      L.inflight.add(p);
    }
    Bus.emit('listen-update', L);
  }
  /* 「朗讀譯文」：一句一句排隊朗讀；朗讀時暫停收音，讀完才繼續，避免辨識器把喇叭的聲音當成說話 */
  function speakCaption(L, text) {
    if (!Store.settings.listenSpeak || !L.ctx.alive() || !L.h) return;
    L.speakChain = (L.speakChain || Promise.resolve()).then(() => new Promise(resolve => {
      if (!L.ctx.alive() || !Store.settings.listenSpeak) return resolve();
      L.h.pause();
      Tts.speak(text, L.to, { onDone: () => { if (L.ctx.alive()) L.h.resume(); resolve(); } });
    }));
  }
  function previewLater(L) {
    if (L.kind !== 'listen' || L.previewBusy || !L.interim.trim() || L.interim === L.lastPreview || !L.ctx.alive()) return;
    L.previewBusy = true; const src = L.interim; L.lastPreview = src;
    Translate.run(src, L.from, L.to).then(res => { if (L.ctx.alive() && !res.failed && L.interim === src) { L.preview = res.text; Bus.emit('listen-update', L); } })
      .catch(() => {}).finally(() => { L.previewBusy = false; L.ctx.later(500, () => previewLater(L)); });
  }
  async function finalize(L, h) {
    await h.stop();                                     // 讓瀏覽器把最後一句送回來
    if (L.interim.trim()) commit(L, L.interim);         // 還沒定稿的句子也保留，不丟掉
    L.interim = ''; L.preview = '';
    // 停止前翻完佇列：等所有進行中的翻譯完成（最多 20 秒）
    await Promise.race([Promise.allSettled([...L.inflight]), sleep(20000)]);
    Rec.finish(L.rid);
    L.finished = true; Bus.emit('listen-update', L);
  }
  return {
    current: stateOf,
    start({ kind, from, to }) {                          // kind: 'transcript' | 'listen'
      if (!needLang(from)) return null;
      if (kind === 'listen' && sameLang(from, to)) { Bus.emit('notify', { key: 'same_lang', type: 'err' }); return null; }
      const ctx = VC.begin(kind === 'listen' ? 'caption' : 'transcript', { label: kind }); if (!ctx) return null;
      let L = null;
      const h = recognize(ctx, {
        lang: sttLang(from), continuous: true, onStart: () => ctx.set('listening'),
        onInterim: tx => { if (!L) return; L.interim = tx; Bus.emit('listen-update', L); previewLater(L); },
        onFinal: tx => { if (L) commit(L, tx); },
      });
      if (!h) return null;
      const rid = Rec.create(kind, { srcLang: from, dstLang: kind === 'listen' ? to : '', state: 'open' });   // 每次開始都是新場次，舊場次自動保存
      ctx.recId = rid;
      L = { rid, kind, ctx, from, to, interim: '', preview: '', inflight: new Set(), previewBusy: false, lastPreview: '', finished: false };
      L.h = h; current = L;
      ctx.own(() => { track(finalize(L, h)); });
      ctx.onHide = () => { if (L.interim.trim()) commit(L, L.interim); L.interim = ''; h.pending = ''; Rec.finish(L.rid); };      // 離開頁面前同步存下最後一句與完成狀態
      ctx.onVisible = () => h.ensure();
      const beat = () => { Rec.beat(rid); ctx.later(3000, beat); }; ctx.later(3000, beat);
      keepAwake(ctx);
      Bus.emit('listen-update', L);
      return L;
    },
    stop() { const c = VC.current(); if (c && (c.mode === 'caption' || c.mode === 'transcript')) c.stop('user'); },
  };
})();

/* ---------- src/js/32-live.js ---------- */
/* =====================================================================
   32 Gemini Live 即時口譯（依官方文件 live-translate）
   - 只要求 AUDIO（官方此模型只列 AUDIO）；不播放時只是不出聲。
   - 目標語言用官方代碼（zh-Hant、pt-BR、fil…）；音訊用 realtimeInput.audio。
   - 單一連線最長約 15 分鐘：14 分鐘提醒，14 分 30 秒預先開新連線、無縫接續，
     同一份紀錄、不用重新要麥克風；收到 goAway 也同樣接續。
   - 連線中也能取消；啟動期間重複按「開始」會被忽略；停止時清掉播放佇列。
   - 逐段累積到紀錄，複製／下載拿到的是完整內容。
   ===================================================================== */
const Live = (() => {
  const WS_BASE = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent';
  const WARN_MS = 14 * 60 * 1000, ROLL_MS = 14.5 * 60 * 1000;
  const CONNECT_MS = 15000, MAX_RETRIES = 5, CHUNK_SAMPLES = 1600, BUFFER_CHUNKS = 80;
  const logLines = [];
  let current = null;
  const scrub = s => { const k = Secret.get(); let out = String(s == null ? '' : s); if (k) out = out.split(k).join('***'); return out; };
  function log(msg) {
    const line = '[' + fmtClock(Date.now()) + '] ' + scrub(msg);
    logLines.push(line); if (logLines.length > 300) logLines.shift();
    Bus.emit('live-log', line);
  }

  /* ---- PCM 工具 ---- */
  function downsample(buf, inRate, outRate) {
    if (outRate >= inRate) return buf;
    const ratio = inRate / outRate, n = Math.round(buf.length / ratio), out = new Float32Array(n);
    for (let i = 0; i < n; i++) { const a = Math.floor(i * ratio), b = Math.min(buf.length, Math.floor((i + 1) * ratio)); let sum = 0, c = 0; for (let j = a; j < b; j++) { sum += buf[j]; c++; } out[i] = c ? sum / c : 0; }
    return out;
  }
  function floatTo16(f32) { const o = new Int16Array(f32.length); for (let i = 0; i < f32.length; i++) { const s = Math.max(-1, Math.min(1, f32[i])); o[i] = s < 0 ? s * 0x8000 : s * 0x7fff; } return o; }
  function toB64(ab) { const bytes = new Uint8Array(ab); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
  function fromB64(b64) { const bin = atob(b64), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new Int16Array(bytes.buffer); }

  /* ---- 分頁／系統音訊擷取 ---- */
  async function captureDisplay(ctx) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) throw Object.assign(new Error('x'), { name: 'NotSupportedError', display: true });
    let stream;
    try { stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, systemAudio: 'include', selfBrowserSurface: 'include' }); }
    catch (e) { if (e && (e.name === 'TypeError' || e.name === 'NotSupportedError')) stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }); else throw e; }
    if (!ctx.alive()) { stream.getTracks().forEach(t => t.stop()); throw new CancelError(); }
    ctx.own(() => stream.getTracks().forEach(t => t.stop()));
    if (!stream.getAudioTracks().length) throw Object.assign(new Error('NO_AUDIO'), { display: true });
    stream.getVideoTracks().forEach(t => t.stop());
    stream.getAudioTracks()[0].addEventListener('ended', () => { if (ctx.alive()) { log('share ended'); ctx.stop('share-ended'); } });
    return stream;
  }

  function setupMessage(L) {
    const lang = langInfo(L.target);
    const setup = {
      model: 'models/' + L.model,
      inputAudioTranscription: {},
      outputAudioTranscription: {},
      generationConfig: { responseModalities: ['AUDIO'], translationConfig: { targetLanguageCode: lang.live || L.target, echoTargetLanguage: true } },
    };
    const terms = Store.phrases().filter(p => p.type === 'glossary' && p.src && p.dst);
    if (terms.length) {
      setup.systemInstruction = { parts: [{ text: 'You are translating live speech into ' + lang.en + '. Always translate these terms exactly as specified: ' + terms.slice(0, 100).map(p => '"' + p.src + '" as "' + p.dst + '"').join('; ') + '.' }] };
    }
    return { setup };
  }

  async function start({ target, source = 'mic', model, play }) {
    const key = Secret.get();
    if (!key) { Bus.emit('notify', { key: 'live_need_key', type: 'err' }); return null; }
    if (typeof WebSocket === 'undefined') { Bus.emit('notify', { key: 'live_no_ws', type: 'err' }); return null; }
    const ctx = VC.begin('live', { label: 'live' }); if (!ctx) return null;             // 啟動期間重複按會回到這裡 null
    ctx.provider = 'Gemini Live'; ctx.set('starting');
    const L = { ctx, target, model: model || DEFAULT_SETTINGS.gemModel, rid: '', sock: null, pending: null, retries: 0, rollTries: 0, buffer: [], acc: [], segId: null, segSrc: '', segDst: '', segStart: 0, timers: [], playHead: 0, sources: new Set(), playCtx: null, sockSeq: 0, sockets: new Set(), rolls: 0, play: () => Store.settings.gemPlay !== false };
    log('start target=' + target + ' model=' + L.model + ' source=' + source);
    // 1) 音訊來源
    let stream;
    try { stream = source === 'display' ? await captureDisplay(ctx) : await ctx.mic({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } }); }
    catch (e) {
      if (e instanceof CancelError || !ctx.alive()) return null;
      log('audio source failed: ' + (e && (e.message || e.name)));
      if (e && e.display) ctx.fail(e.message === 'NO_AUDIO' ? 'display_no_audio' : 'display_unsupported');
      else if (source === 'display' && e && e.name === 'NotAllowedError') ctx.fail('display_cancelled');
      else ctx.fail(VC.micErrKey(e));
      return null;
    }
    if (!ctx.alive()) return null;
    // 2) 紀錄與音訊處理（整個場次只建立一次，換連線時不重來）
    L.rid = Rec.create('live', { srcLang: 'auto', dstLang: target, state: 'open', provider: 'gemini-live' }); ctx.recId = L.rid;
    current = L;
    ctx.own(() => { closeAll(L); finalizeSeg(L); Rec.finish(L.rid); stopPlayback(L); L.stopped = true; Bus.emit('live-update', L); });
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const inCtx = new AC(); ctx.own(() => { try { inCtx.close(); } catch (_) {} });
      if (inCtx.resume) inCtx.resume().catch(() => {});
      const srcNode = inCtx.createMediaStreamSource(stream);
      const node = inCtx.createScriptProcessor(4096, 1, 1);
      srcNode.connect(node); node.connect(inCtx.destination);
      ctx.own(() => { try { node.onaudioprocess = null; node.disconnect(); srcNode.disconnect(); } catch (_) {} });
      node.onaudioprocess = e => {
        if (!ctx.alive()) return;
        const down = downsample(e.inputBuffer.getChannelData(0), inCtx.sampleRate, 16000);
        for (let i = 0; i < down.length; i++) L.acc.push(down[i]);
        while (L.acc.length >= CHUNK_SAMPLES) {                       // 官方建議每塊約 100 毫秒
          const chunk = floatTo16(Float32Array.from(L.acc.splice(0, CHUNK_SAMPLES)));
          sendAudio(L, toB64(chunk.buffer));
        }
      };
    } catch (e) { log('audio graph failed: ' + (e && e.message)); ctx.fail('live_audio_failed'); return null; }
    keepAwake(ctx);
    ctx.onVisible = () => { Bus.emit('live-update', L); };
    ctx.onHide = () => { finalizeSeg(L); Rec.finish(L.rid); };
    ctx.set('connecting', { note: '' });
    L.sock = null; openSocket(L, 'start');
    return L;
  }

  function sendAudio(L, b64) {
    const s = L.sock;
    if (s && s.ready && s.ws.readyState === 1) { try { s.ws.send(JSON.stringify({ realtimeInput: { audio: { mimeType: 'audio/pcm;rate=16000', data: b64 } } })); return; } catch (_) {} }

const Layers = (() => {
  const st = [];
  return {
    push(fn) { const e = { fn }; st.push(e); return () => { const i = st.indexOf(e); if (i >= 0) st.splice(i, 1); }; },
    closeTop() { const e = st.pop(); if (!e) return false; try { e.fn(); } catch (_) {} return true; },
    closeAll() { while (st.length) this.closeTop(); },

function moreMenu(id, items, { label = 'tr_more', cls = '' } = {}) {
  const btn = h('button', { type: 'button', id, class: 'iconbtn more ' + cls, 'aria-haspopup': 'menu', 'aria-expanded': 'false', ta: { 'aria-label': label, title: label }, text: '⋯' });

const toastOnce = new Map();
function toast(msg, o = {}) {

  if (o.action) el.append(h('button', { type: 'button', text: o.action.label, onclick: () => { el.remove(); o.action.fn(); } }));
  box.append(el);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => el.remove(), o.ttl || (o.type === 'err' ? 7000 : 3200));
}

let dialogDepth = 0;
function dialog({ title, body = [], buttons, dismiss = null, wide }) {
  let closer = null;
  const promise = new Promise(resolve => {
    const prev = document.activeElement;
    const tid = 'dlg' + Math.random().toString(36).slice(2, 7);
    const acts = h('div', { class: 'acts' });
    const dlg = h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': tid, tabindex: '-1' }, h('h2', { id: tid, text: title }), ...[].concat(body), acts);
    const ov = h('div', { class: 'overlay' }, dlg);
    const app = $('#app');
    function close(v) {
      document.removeEventListener('keydown', onKey, true); ov.remove(); dialogDepth--;
      if (!dialogDepth && app) app.inert = false;
      if (prev && prev.focus && prev.isConnected) prev.focus();
      resolve(v);
    }
    function onKey(e) {
      if (!ov.isConnected) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(dismiss); }
      else if (e.key === 'Tab') {
        const f = $$('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])', dlg).filter(x => !x.disabled && x.offsetParent !== null);
        if (!f.length) { e.preventDefault(); return; }
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === first || document.activeElement === dlg)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    for (const b of buttons) acts.append(h('button', { type: 'button', class: 'btn ' + (b.kind || ''), text: b.text || t(b.key), id: b.id, onclick: () => close(b.value) }));
    document.addEventListener('keydown', onKey, true);
    dialogDepth++; if (app) app.inert = true;
    document.body.append(ov);
    const firstBtn = acts.querySelector('.primary') || acts.lastChild; (firstBtn || dlg).focus();
    closer = close;
  });
  promise.close = v => { if (closer) closer(v); };          // 程式自己要關掉這個對話框時用（例如連結被取消）
  return promise;
}

  catch (_) {
    const ta = h('textarea', { 'aria-hidden': 'true', style: 'position:fixed;left:-9999px', value: text }); document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove();

  }
}

/* 以文字稿格式整理一筆紀錄（TXT／複製／校對用） */
function recordPlain(r, withTime) {

/* ---------- 狀態標籤與橫幅 ---------- */
function saveTagInfo() {
  const st = Store.st, f = Folder.fs;
  if (!st.ready) return ['st_loading', '', {}];
  if (st.stale) return ['st_stale', 'err', {}];
  if (st.noHistory) return ['st_nohist', 'priv', {}];
  if (st.error) return ['st_error', 'err', {}];
  if (st.mode === 'mem') return ['st_mem', 'err', {}];
  if (f.conflicts.length) return ['st_conflict', 'warn', { n: f.conflicts.length }];
  if (f.handle && f.status === 'needPermission') return ['st_folder_perm', 'warn', {}];
  if (f.handle && f.status === 'error') return ['st_folder_err', 'err', {}];
  if (st.saving || st.pending) return ['st_saving', '', {}];
  if (f.handle && f.leader === false) return ['st_folder_other', '', {}];
  if (f.handle && (f.busy || f.dirty)) return ['st_folder_wait', '', {}];
  if (f.handle && f.status === 'ok') return ['st_folder_ok', '', { time: f.lastSync ? fmtClock(f.lastSync).slice(0, 5) : '—' }];
  if (st.mode === 'ls') return ['st_local_ls', 'warn', {}];
  return ['st_local', '', {}];
}
function renderStatus() {

    { name: '[Content_Types].xml', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>' },
    { name: '_rels/.rels', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>' },
    { name: 'word/document.xml', text: doc }]);
}
function exportWord(r) {
  if (!r.segments.length) { toast(t('nothing_to_export'), { type: 'err' }); return; }
  downloadBlob(docxBlob(recTitle(r), fmtTime(r.updated), recordRows(r)), safeFile(recTitle(r)) + '_' + minuteStamp() + '.docx'); toast(t('exported_word'));
}

/* ---------- src/js/90-boot.js ---------- */
/* =====================================================================
   90 啟動、全域事件、快捷鍵
   ===================================================================== */
S('boot_failed', '程式啟動失敗，請重新整理頁面。若仍失敗，請換用最新版 Chrome 或 Edge。', 'The app failed to start. Reload the page; if it still fails, try the latest Chrome or Edge.');
S('interrupted_note', '有一場錄製上次被中斷，已保留到最後一次存檔的內容，可在「紀錄」找到。', 'A recording was interrupted last time. Content up to the last checkpoint is saved in Records.');

function rebuildAll() {
  refreshI18n(); refreshLangSelects(); document.title = t('app_title');
  renderStatus(); renderSettings(); renderRecList(); renderConv(); renderStar(); renderRecent(); renderListen(); renderListenBtn(VC.snapshot()); setLiMode(LI.mode); renderOutput(); renderFaceButtons(VC.snapshot()); renderPartner(); renderRecList();
  if (RC.openId) renderDetail(false);
}
function markInterrupted() {
  let n = 0;
  for (const r of Store.records()) {
    if (r.state === 'open' && r.install === Store.local.installId && r.owner !== Store.tabId && Date.now() - (r.ownerBeat || 0) > 120000) { Store.mutate(r.id, x => { if (x.state === 'open') x.state = 'interrupted'; }); n++; }
  }
  return n;
}
async function main() {
  UILANG = browserUiLang();
  try {
    await Store.boot();
    await Secret.load();
    await Migration.run();
    applyPrefs();
    buildShell(); buildTranslate(); buildFace(); buildListen(); buildRecords(); buildSettings();
    selectTab(Store.local.tab);
    if (!Store.local.onboarded && !Store.st.stale) runOnboarding();
    renderStatus();
    if (markInterrupted()) toast(t('interrupted_note'), { type: 'warn', ttl: 9000 });
    await Folder.init();
  } catch (e) {
    console.error(e);
    const app = document.getElementById('app'); if (app) app.textContent = t('boot_failed');
    return;
  }
  const hide = () => { Store.flushOnHide(); };
  // 離開頁面：先「同步」把最後一句與完成狀態存進去，再寫急救副本與資料庫，最後才停止
  const leaving = () => { const v = VC.current(); if (v && v.onHide) { try { v.onHide(); } catch (_) {} } Store.flushOnHide(); };
  window.addEventListener('pagehide', () => { leaving(); VC.stopAll('pagehide'); });
  window.addEventListener('beforeunload', leaving);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') hide(); });     // 切到別的分頁／視窗：只存檔，不停止錄音
  setInterval(markInterrupted, 30000);
  Bus.on('folder-remote', () => Folder.reloadState && Folder.reloadState());
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (dialogDepth) return;
      if (Layers.closeTop()) { e.preventDefault(); return; }        // 選單、語言選擇器、簡報檢視：Esc 只關最上面那一層，不會結束錄音
      if (Zoom.isOpen()) { Zoom.close(); return; }
      VC.stopAll('esc'); Tts.cancel(); return;
    }
    // 麥克風快捷鍵用 Alt+Shift+M；Ctrl/⌘+Shift+V（純文字貼上）不再被攔截
    if (e.altKey && e.shiftKey && !e.ctrlKey && !e.metaKey && e.code === 'KeyM') { e.preventDefault(); if (currentTab === 'translate') { const b = $('#mic-btn'); if (b) b.click(); } }
  });
  Bus.on('stale', reason => { VC.stopAll('stale'); if (reason === 'cleared') Secret.memClear(); });
}
main();

})();
